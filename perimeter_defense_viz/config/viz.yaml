# Tactical RViz styling. Colours are RGBA in [0, 1].
layout_markers:
  ros__parameters:
    aerial_variant: day          # day or night background image
    grid_spacing: 5.0            # m
    label_height: 0.7            # m, text height on the map
    colors:
      fence: [0.85, 0.85, 0.75, 0.9]
      breach: [0.95, 0.15, 0.10, 1.0]
      objective: [0.95, 0.15, 0.10, 1.0]
      authorized: [0.30, 0.60, 1.00, 0.14]
      grid: [0.0, 0.0, 0.0, 0.35]
      label: [1.0, 1.0, 1.0, 0.95]
      route_lup1: [0.30, 0.65, 1.00, 0.8]
      route_lup2: [0.30, 0.90, 0.70, 0.8]
      route_lup3: [1.00, 0.80, 0.25, 0.8]

fleet_markers:
  ros__parameters:
    rate: 15.0                   # Hz, symbols follow the robots smoothly
    symbol_width: 3.0            # m, friendly unit frame drawn on the map
    symbol_height: 2.0           # m
    heading_length: 2.5          # m
    sensor_range: 10.0           # m, detection ring
    friendly_color: [0.25, 0.60, 1.00, 1.0]

status_board:
  ros__parameters:
    origin: [40.5, 32.0]         # m, top-left corner of the board, east of the base
    width: 16.0                  # m
    text_height: 0.7             # m
    line_spacing: 0.95           # m
    max_contacts: 6              # most recent contacts shown
    rate: 2.0                    # Hz
    transponder_timeout: 3.0     # s without a fix -> soldier NO SIGNAL
