# Single source of truth for the base geometry.
# Coordinates in metres, origin at the south-west corner, x east, y north.
# The Gazebo world, the Nav2 map, the RViz markers and the dashboard map are
# all generated from this file, so they always match.
# The base, its name and the officer it is named after are fictional.

base:
  name: "Baza Militară \"Căpitan Ion Vulturescu\""
  unit: "Centrul de Comandă Sector Nord"
  code: "FOB-3"

# Map grid for the C2 dashboard: the local origin (0, 0) is placed at this
# MGRS point (fictional placement in farmland of the Romanian plain, UTM
# zone 35T). The local frame is aligned with the UTM grid: x = easting,
# y = northing, so a local point (x, y) is MGRS easting + x, northing + y.
georef:
  mgrs_origin: "35TNK1500038000"

area:
  width: 40.0
  height: 28.0

fence:
  min: [2.0, 2.0]
  max: [38.0, 26.0]
  height: 2.0
  post_spacing: 2.5
  post_size: 0.08
  # Thickness used for the collision wall and the occupancy map.
  thickness: 0.06
  breaches:
    - name: north
      side: north        # gap along y = max_y
      from: 29.0
      to: 32.0
    - name: west
      side: west         # gap along x = min_x
      from: 8.0
      to: 11.0

buildings:
  - {name: command,    label: "Command",    min: [5.0, 18.0],  max: [12.0, 23.0], height: 3.6, style: plaster_cream}
  - {name: barracks,   label: "Barracks",   min: [5.0, 5.0],   max: [11.0, 13.0], height: 3.2, style: plaster_ochre}
  - {name: hangar,     label: "Hangar",     min: [16.0, 17.0], max: [24.0, 23.0], height: 3.0, style: hangar_arch}
  - {name: workshop,   label: "Workshop",   min: [28.0, 16.0], max: [34.0, 20.0], height: 3.4, style: metal}
  - {name: container1, label: "Container",  min: [15.0, 8.0],  max: [17.0, 13.0], height: 2.6, style: container_green}
  - {name: container2, label: "Container",  min: [25.0, 6.0],  max: [27.0, 12.0], height: 2.6, style: container_tan}
  - {name: depot,      label: "Ammo depot", min: [18.0, 4.0],  max: [23.0, 8.0],  height: 3.0, style: bunker}
  - {name: detention,  label: "Detention",  min: [32.6, 6.6],  max: [35.2, 11.2], height: 3.0, style: detention}

# Smaller static props. All of them are drawn into the occupancy map.
props:
  - {name: sandbags_w,  type: sandbags, min: [18.0, 8.8],  max: [19.3, 9.3],  height: 0.8}
  - {name: sandbags_e,  type: sandbags, min: [21.7, 8.8],  max: [23.0, 9.3],  height: 0.8}
  - {name: vehicle_1,   type: vehicle,  min: [30.2, 6.5],  max: [32.4, 11.3], height: 1.9}
  - {name: tower_sw,    type: tower,    min: [2.6, 2.6],   max: [3.4, 3.4],   height: 4.5}
  - {name: tower_ne,    type: tower,    min: [36.7, 24.7], max: [37.5, 25.5], height: 4.5}
  - {name: hesco_depot, type: hesco,    min: [17.2, 4.2],  max: [17.8, 8.2],  height: 1.4}
  - {name: flagpole,    type: flagpole, min: [8.4, 16.9],  max: [8.6, 17.1],  height: 7.0}

# Ground markings drawn on the ground texture only (no collision).
markings:
  helipad: {center: [27.0, 23.3], radius: 1.9}

# Concrete slab roads drawn on the ground texture only (no collision).
roads:
  width: 2.2
  polylines:
    - [[8.5, 15.5], [14.5, 15.5], [14.5, 24.8], [3.6, 24.8]]
    - [[14.5, 15.5], [14.5, 14.0], [25.0, 14.0], [25.0, 15.5]]
    - [[12.5, 14.0], [12.5, 3.2], [24.0, 3.2], [24.0, 14.0]]
    - [[25.0, 14.0], [29.0, 14.0], [29.0, 3.8], [36.5, 3.8], [36.5, 24.0]]
    - [[20.5, 14.0], [20.5, 9.4]]

objective:
  name: ammo_depot
  target: [20.5, 9.2]
  radius: 2.5

# Areas where own personnel may move freely (polygons, counter-clockwise).
authorized_zones:
  - name: west_compound
    polygon: [[3.5, 3.5], [14.0, 3.5], [14.0, 25.0], [3.5, 25.0]]
  - name: hangar_area
    polygon: [[13.5, 14.5], [25.5, 14.5], [25.5, 25.0], [13.5, 25.0]]
  - name: detention_area
    polygon: [[29.5, 5.8], [36.5, 5.8], [36.5, 13.4], [29.5, 13.4]]

# Captured intruders are escorted to the detention building by the UGV that
# captured them (or by a soldier in the scenario with soldiers). The UGV stops
# at robot_stop, east of the door; the detainee walks through the entry into
# the cell.
detention:
  building: detention
  entry: [33.9, 12.1]
  cell: [33.9, 8.9]
  robot_stop: [35.3, 12.7]

# Own soldiers on foot, only in the scenario with soldiers (soldiers:=true;
# the default base is fully robotic). They walk their route in a loop, carry
# a transponder, report intruders they see by radio and escort captured
# intruders to the detention building. They cannot stop an intruder.
soldiers:
  soldier1: {callsign: "SLD-1", route: [[4.0, 4.2], [12.0, 4.2], [12.0, 13.8], [4.0, 13.8]]}
  soldier2: {callsign: "SLD-2", route: [[15.0, 15.2], [25.0, 15.2], [25.0, 24.5], [15.0, 24.5]]}
  soldier3: {callsign: "SLD-3", route: [[30.2, 12.6], [35.4, 12.6]]}

patrol_routes:
  lup1: [[3.5, 24.5], [14.0, 24.5], [13.5, 15.0], [3.5, 15.0]]
  lup2: [[36.0, 4.0], [29.0, 4.0], [29.0, 14.0], [36.0, 24.0]]
  lup3: [[13.0, 3.0], [13.0, 14.0], [24.0, 14.0], [24.0, 3.0]]
  # Transport UGV (TRN-1): parking place east of the detention building, out of the patrol
  # routes; first point = parking place, second = heading. It does not patrol.
  trn1: [[36.8, 8.0], [36.8, 10.0]]
  # Whole-base loop for a single UGV (scenario with one robot): east side,
  # north edge, west side, south road, then through the centre past the depot.
  base: [[36.0, 4.0], [36.0, 24.0], [14.0, 24.5], [3.8, 24.5], [3.8, 14.5], [3.8, 4.0],
         [13.0, 3.0], [13.0, 14.0], [29.0, 14.0], [29.0, 4.0]]

intruder_spawns:
  north_breach: [30.5, 27.2]
  west_breach: [0.8, 9.5]
  north_route_west: [25.5, 14.2]
  north_route_east: [36.0, 13.0]

# Fictional countryside around the base (Romanian plain): farmland strips, a
# county road with an access road to the main gate, an irrigation canal and
# acacia windbreaks. Visual only, outside the Nav2 map. Tree rows are kept at
# least 12 m from the fence so they never fall inside the 10 m detection radius
# of a robot inside the base.
surroundings:
  bounds: {min: [-40.0, -30.0], max: [80.0, 58.0]}
  farmland_seed: 21
  county_road: {y: -7.0, width: 7.0}
  access_road: {x: 20.0, width: 4.0}
  main_gate: {from: 18.5, to: 21.5}     # on the south fence, closed
  canal: {x: -14.0, width: 3.0}
  tree_rows:
    - {from: [-40.0, -11.5], to: [80.0, -11.5], spacing: 3.5}
    - {from: [-18.0, -30.0], to: [-18.0, 58.0], spacing: 4.0}
    - {from: [-40.0, 40.0], to: [80.0, 40.0], spacing: 4.0}

# Area covered by the top-down render (RViz background, dashboard map).
render:
  bounds: {min: [-15.0, -12.0], max: [55.0, 40.0]}
  pixels_per_metre: 30.0
