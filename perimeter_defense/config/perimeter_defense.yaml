# Parameters of the perimeter defense nodes (individual contribution).
fence_sensor:
  ros__parameters:
    uncertainty: 1.5          # m, coarse fence sensor accuracy
    min_blocked_beams: 2
    clearance: 0.4            # m shorter than the clear gap counts as blocked
    cooldown: 3.0             # s between alerts of the same breach

person_detector:
  ros__parameters:
    rate: 10.0
    max_scan_age: 0.3
    fusion_radius: 0.8        # m, detections of several robots merged
    detection_radius: 10.0    # m, around each robot
    min_range: 0.3
    cluster_tolerance: 0.35   # m between neighbouring returns
    min_points: 2
    min_width: 0.15           # m; a person seen side-on is only 0.15-0.25 m deep
    max_width: 0.9
    static_margin: 0.35       # m, returns closer to the static map are walls ...
    static_margin_per_m: 0.035  # ... plus this per metre of range (AMCL heading error)
    robot_exclusion: 1.0      # m, returns around own robots (body + localization error)
    centroid_offset: 0.1      # m, lidar sees the near surface of the body
    consistency_range: 15.0   # m, returns used for the localization consistency check
    min_map_consistency: 0.6  # fraction the static map must explain, else the scan is ignored
    min_consistency_points: 40

tracker:
  ros__parameters:
    rate: 10.0
    accel_std: 1.0            # m/s^2, constant velocity model process noise
    meas_std: 0.2             # m, lidar detection
    fence_std: 1.5            # m, fence sensor
    init_vel_std: 1.5         # m/s
    gate_chi2: 9.21           # 99 % gate, 2 dof
    confirm_hits: 3
    confirm_window: 1.0       # s
    lost_timeout: 1.5         # s without detection -> LOST (prediction continues)
    delete_after: 8.0         # s in LOST -> deleted
    lost_velocity_tau: 2.0    # s, velocity of a LOST track decays (people stop)
    alert_timeout: 20.0       # s for a fence or spot report alert to be confirmed
    max_speed: 3.5            # m/s
    neutralized_keep: 10.0
    max_assoc_distance: 3.0   # m, detection to track, on top of the chi-square gate
    alert_merge_radius: 8.0   # m, a hostile lidar track this close confirms an ALERT track
    duplicate_distance: 0.7   # m, two confirmed tracks this close are merged (same person)
    captured_merge_distance: 1.0  # m, a track this close to a captured person is him
    prediction_horizon: 6.0   # s
    prediction_step: 0.2      # s
    obstacle_margin: 0.2      # m, prediction stops at obstacles

interceptor_allocator:
  ros__parameters:
    mode: follow              # M2: follow; M3: predictive or naive
    period: 0.3               # s, role recalculation
    neutralize_distance: 1.0  # m
    resend_distance: 0.7      # m, goal resent if the target moved more
    resend_period: 0.6        # s, or if this much time passed
    standoff: 0.5             # m, goal short of the target (it is an obstacle)
    max_speed: 2.0            # m/s
    hold_timeout: 120.0       # s a robot stays with a captured person at most
    escort_by: robot          # robot (fully robotic base) or soldier
    hold_time: 2.0            # s securing the captured person before the escort
    escort_speed: 0.6         # m/s, walking pace of the detainee
    escort_wait_distance: 3.0 # m, the robot waits when the detainee falls behind
    handover_timeout: 20.0    # s at the detention door at most
    inside_margin: 0.6        # m beyond the fence still counted as inside (people in a breach)
    goal_clearance: 0.8       # m, robot goals are kept this far inside the fence

iff:
  ros__parameters:
    rate: 2.0
    gate: 2.0                 # m, transponder fix to track (2 sigma of a 1 m transponder)
    min_matches: 2            # consecutive matches before a track is FRIEND
    max_fix_age: 1.5          # s
    friend_hold: 3.0          # s a track stays FRIEND after its last transponder match
    hostile_after: 2.0        # s of lidar tracking without transponder -> HOSTILE
    zone_alert_cooldown: 30.0 # s between UNAUTHORIZED_ZONE alerts of one soldier
    zone_margin: 1.5          # m tolerated around the authorized zones (track noise)
    return_time: 60.0         # s a soldier may stay off his zone after a detention
